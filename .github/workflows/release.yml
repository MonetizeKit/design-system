name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Publishing uses npm trusted publishing (OIDC); there is no npm token.
      # Each package needs a trusted publisher on npmjs.com naming this
      # repository and `release.yml` (no environment), with direct
      # `npm publish` allowed. `pnpm publish` hands the upload to the npm CLI,
      # which only performs the OIDC exchange from 11.5.1; Node 22 bundles npm 10.
      - name: Install npm with trusted publishing support
        run: |
          npm install -g npm@11
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }' "$(npm --version)"
          echo "npm $(npm --version)"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      # No registry-url: setup-node would write an .npmrc carrying a
      # NODE_AUTH_TOKEN placeholder, and a token in the npm config competes
      # with the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The release PR is pushed and opened by the automation account so its CI
      # runs; a PR pushed by GITHUB_TOKEN has its pull_request runs parked as
      # action_required and the required gate never reports. Without the
      # credential this falls back to GITHUB_TOKEN. It is fetched only after
      # install and build so dependency scripts never see it; changesets/action
      # writes its own ~/.netrc from the token, so checkout persists nothing.
      - name: Fetch automation secrets from Phase
        env:
          PHASE_TOKEN: ${{ secrets.PHASE_SDLC_TOKEN }}
          PHASE_ENV: sdlc
          PHASE_APP_ID: 026988b7-1ffa-499c-913b-3d0f031c4e58
        run: |
          mkdir -p /tmp/phase-export
          curl -fsSL "https://raw.githubusercontent.com/MonetizeKit/.github/v1/scripts/phase/export-secrets.mjs" -o /tmp/phase-export/export-secrets.mjs
          node /tmp/phase-export/export-secrets.mjs GH_PAT

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ env.GH_PAT || secrets.GITHUB_TOKEN }}
